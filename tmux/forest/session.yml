# do not modify these
root: ./
name: real_drone
socket_name: mrs
attach: false
tmux_options: -f /etc/ctu-mrs/tmux.conf
# you can modify these export ROS_MASTER_URI='http://192.168.8.157:11311'; export ROS_IP='192.168.8.157';
pre_window: source ./scripts/env.sh
startup_window: status
windows:
  - roscore:
      layout: tiled
      panes:
        - roscore
        - waitForRos; rosparam set use_sim_time false
  - tf:
      layout: tiled
      panes:
        - waitForTime; roslaunch $ROS_LAUNCH_PATH/static_tfs_ZD700.launch
  - hw_api:
      layout: tiled
      panes:
        - waitForTime; roslaunch $ROS_LAUNCH_PATH/api.launch custom_config:=$ROS_CONFIG_PATH/api.yaml
        - waitForTime; [ $RESET_COMMAND_FLAG -eq 1 ] && sleep 5; rosservice call /$UAV_NAME/mavros/cmd/command "$RESET_COMMAND"
  - RTK:
      layout: tiled
      panes:
        - waitForTime; roslaunch mrs_serial rtk.launch
  - Lidar:
      layout: tiled
      panes:
        - waitForTime; roslaunch $ROS_LAUNCH_PATH/lslidar_c16_ns.launch
  - gnss:
      layout: tiled
      panes:
        - waitForHw; roslaunch $ROS_LAUNCH_PATH/gnss_status_verifier.launch
  - navsat:
      layout: tiled
      panes:
        -  waitForHw; roslaunch $ROS_LAUNCH_PATH/navsat.launch
  # - switch_estimator:
  #     layout: tiled
  #     panes:
  #       -  waitForHw; roslaunch $ROS_LAUNCH_PATH/switch_estimator.launch
  # - distance_filter:
  #     layout: tiled
  #     panes:
  #       -  waitForHw; roslaunch $ROS_LAUNCH_PATH/range_filter.launch
  - distance_adaptive:
      layout: tiled
      panes:
        -  waitForHw; roslaunch $ROS_LAUNCH_PATH/range_adaptative.launch
        - 'history -s rosservice call /$UAV_NAME/control_manager/goto_fcu \"goal: \[5.0, 0.0, 0.0, 0.0\]\"'
        - 'history -s rosservice call /$UAV_NAME/control_manager/stop \"{}\"'
        - 'history -s rosservice call /$UAV_NAME/uav_manager/takeoff \"{}\"'
  # - imu_cal:
  #     layout: tiled
  #     panes:
  #       -  waitForHw; roslaunch $ROS_LAUNCH_PATH/imu_cal_uav.launch
  - imu_filter:
      layout: tiled
      panes:
        -  waitForHw; roslaunch $ROS_LAUNCH_PATH/imu_upsampler.launch
  # - imu_wit:
  #     layout: tiled
  #     panes:
  #       -  waitForHw; roslaunch $ROS_LAUNCH_PATH/witmotion.launch
  - core:
      layout: tiled
      panes:
        - waitForHw; sleep 10; roslaunch $ROS_LAUNCH_PATH/mrs_core.launch
  # - tf_connector:
  #     layout: tiled
  #     panes:
  #       - waitForTime; [ $COMPUTER_RVIZ -eq 1 ] && roslaunch $ROS_LAUNCH_PATH/tf_relay.launch || exit
  # - lio_sam:
  #     layout: tiled
  #     panes:
  #       - waitForHw; sleep 15; roslaunch $ROS_LAUNCH_PATH/lio_sam/run_uav.launch
  - fast_lio:
      layout: tiled
      panes:
        - waitForHw; sleep 5; roslaunch $ROS_LAUNCH_PATH/fastlio2.launch
  # - republisher:
  #     layout: tiled
  #     panes:
  #       -  waitForHw; roslaunch $ROS_LAUNCH_PATH/repub_odom_tf_desired.launch
  - octomap:
      layout: tiled
      panes:
        - waitForHw; sleep 6; roslaunch $ROS_LAUNCH_PATH/mrs_mapplan_octomapping.launch config_octomap_server:=./config/octomap/octomap_server.yaml config_octomap_planner:=./config/octomap/octomap_planner.yaml config_pcl_filter_ouster:=./config/octomap/lidar_filter_mapping.yaml world_frame_id:=$UAV_NAME/local_origin #world_frame_id:=$UAV_NAME/world_origin
  - octomap_min:
      layout: tiled
      panes:
        - waitForHw; sleep 6; roslaunch $ROS_LAUNCH_PATH/mrs_octomapping.launch
  - monitor:
      layout: tiled
      panes:
        - waitForHw; roslaunch $ROS_LAUNCH_PATH/node_crash_checker.launch
  - status:
      layout: tiled
      panes:
        - waitForHw; roslaunch $ROS_LAUNCH_PATH/fsm_uav.launch
        - waitForHw; roslaunch mrs_uav_autostart automatic_start.launch custom_config:=$ROS_CONFIG_PATH/automatic_start.yaml
        - waitForHw; roslaunch mrs_uav_status status.launch config_file:=$ROS_CONFIG_PATH/status_info.yaml
  - swarm:
      layout: tiled
      panes:
        - waitForControl; roslaunch $ROS_LAUNCH_PATH/swarm_sweeping_generator.launch
        - 'history -s rosservice call /$UAV_NAME/sweeping_generator/start 0.2'
  - constraint_manager:
      layout: tiled
      panes:
        - 'history -s rosservice call /$UAV_NAME/constraint_manager/set_constraints \"value: \fast\"'
  - t_goto:
      layout: tiled
      panes:
        - waitForHw; history -s roslaunch mrs_uav_autostart automatic_start.launch
        - 'history -s rosservice call /$UAV_NAME/control_manager/goto \"goal: \[12.0, 51.0, 3.0, 0.0]\"'
        - 'history -s rosservice call /$UAV_NAME/control_manager/goto \"goal: \[5.0, 21.5, 3.0, 0.0\]\"'
        - 'history -s rosservice call /$UAV_NAME/control_manager/stop \"{}\"'
  - t_goto_octo:
      layout: tiled
      panes:
        - waitForHw; history -s roslaunch mrs_uav_autostart automatic_start.launch
        - 'history -s rosservice call /$UAV_NAME/octomap_planner/goto \"goal: \[13.72, 51.51, 10.5, 0.0]\"'
        - 'history -s rosservice call /$UAV_NAME/octomap_planner/goto \"goal: \[10.0, 32.0, 10.0, 0.0\]\"'
        - 'history -s rosservice call /$UAV_NAME/octomap_planner/stop \"{}\"'
  - t_demo:
      layout: tiled
      panes:
        - waitForHw; history -s roslaunch mrs_uav_autostart automatic_start.launch
        - 'history -s rosservice call /$UAV_NAME/control_manager/goto_altitude \"goal: 10.0\"'
        - 'history -s ./scripts/poses.sh'
  - commands:
      layout: tiled
      panes:
        - waitForHw; history -s roslaunch mrs_uav_autostart automatic_start.launch
        - waitForHw; history -s rosservice call /$UAV_NAME/hw_api/arming 1; sleep 2; rosservice call /$UAV_NAME/hw_api/offboard
        - waitForHw; history -s rosservice call /$UAV_NAME/mavros/cmd/command \"{broadcast:\ false, command:\ 246, confirmation:\ 0, param1:\ 1.0, param2:\ 0.0, param3:\ 0.0, param4:\ 0.0, param5:\ 0.0, param6:\ 0.0, param7:\ 0.0}\"
  - MapGlobalService:
      layout: tiled
      panes:
        - waitForControl; roslaunch $ROS_LAUNCH_PATH/map_global_service.launch
        - 'history -s rosservice call /$UAV_NAME/map_global_generation/save_map'
  - Nimbro:
      layout: tiled
      panes:
        - waitForTime; roslaunch $ROS_LAUNCH_PATH/tf_throttle.launch
        - waitForTime; rosrun mrs_openswarm_real run_nimbro.py ./config/network_config.yaml `rospack find mrs_openswarm_real`/config/communication_config.yaml
  - bag:
      layout: tiled
      panes:
        - waitForRos; [ $SYS_ROSBAG_ENABLED -eq 1 ] && history -s rosbag record $SYS_ROSBAG_ARGS $SYS_ROSBAG_TOPICS || exit
  - rviz:
      layout: tiled
      panes:
        - waitForTime; [ $USE_RVIZ -eq 1 ] && roslaunch $ROS_LAUNCH_PATH/mrs_rviz.launch
        - waitForTime; [ $USE_RVIZ -eq 1 ] && roslaunch $ROS_LAUNCH_PATH/display_zd700.launch
        - waitForTime; [ $USE_RVIZ -eq 1 ] && roslaunch mrs_rviz_plugins rviz_interface.launch