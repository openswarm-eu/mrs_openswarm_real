# do not modify these
root: ./
name: real_drone
socket_name: mrs
attach: false
tmux_options: -f /etc/ctu-mrs/tmux.conf
# you can modify these export ROS_MASTER_URI='http://192.168.8.157:11311'; export ROS_IP='192.168.8.157';
pre_window: source ./scripts/env_ferox.sh
startup_window: status
windows:
  - roscore:
      layout: tiled
      panes:
        - roscore
        - waitForRos; rosparam set use_sim_time false
  - tf:
      layout: tiled
      panes:
        - waitForTime; roslaunch $ROS_LAUNCH_PATH/static_tfs_ZD700.launch
  - hw_api:
      layout: tiled
      panes:
        - waitForTime; roslaunch $ROS_LAUNCH_PATH/api.launch custom_config:=$ROS_CONFIG_PATH/api.yaml
        - waitForTime; [ $RESET_COMMAND_FLAG -eq 1 ] && sleep 5; rosservice call /$UAV_NAME/mavros/cmd/command "$RESET_COMMAND"
  - RTK:
      layout: tiled
      panes:
        - waitForTime; roslaunch mrs_serial rtk.launch
  # - RTK_yaw:
  #     layout: tiled
  #     panes:
  #       - waitForTime; roslaunch $ROS_LAUNCH_PATH/rtk_yaw.launch
  - Lidar:
      layout: tiled
      panes:
        - waitForTime; roslaunch $ROS_LAUNCH_PATH/lslidar_c16_ns.launch
  - gnss:
      layout: tiled
      panes:
        - waitForHw; roslaunch $ROS_LAUNCH_PATH/gnss_status_verifier.launch
  - navsat:
      layout: tiled
      panes:
        -  waitForHw; roslaunch $ROS_LAUNCH_PATH/navsat.launch
  - imu_cal:
      layout: tiled
      panes:
        -  waitForHw; sleep 10; roslaunch $ROS_LAUNCH_PATH/imu_cal_uav.launch
  - imu_wit:
      layout: tiled
      panes:
        -  waitForHw; roslaunch $ROS_LAUNCH_PATH/witmotion.launch
  # - range_cal:
  #     layout: tiled
  #     panes:
  #       -  waitForHw; sleep 10; roslaunch $ROS_LAUNCH_PATH/range_cal.launch
  - core:
      layout: tiled
      panes:
        - waitForHw; roslaunch $ROS_LAUNCH_PATH/mrs_core.launch
  - lio_sam:
      layout: tiled
      panes:
        - waitForHw; sleep 15; roslaunch $ROS_LAUNCH_PATH/lio_sam/run_uav.launch
  - tf_connector:
      layout: tiled
      panes:
        # - waitForTime; roslaunch mrs_tf_connector tf_connector.launch custom_config:=./config/tf_connector.yaml
        - waitForTime; [ $COMPUTER_RVIZ -eq 1 ] && roslaunch $ROS_LAUNCH_PATH/tf_relay.launch || exit
  - octomap:
      layout: tiled
      panes:
        - waitForHw; sleep 6; roslaunch $ROS_LAUNCH_PATH/mrs_mapplan_octomapping.launch config_octomap_server:=./config/octomap/octomap_server.yaml config_octomap_planner:=./config/octomap/octomap_planner.yaml config_pcl_filter_ouster:=./config/octomap/lidar_filter_mapping.yaml world_frame_id:=$UAV_NAME/stable_origin
  - swarm:
      layout: tiled
      panes:
        - waitForTime; sleep 3; [ $SWARM_FORMATION -eq 1 ] && roslaunch $ROS_LAUNCH_PATH/mrs_swarm_formation.launch drone_id:=0 odom_topic:=/$UAV_NAME/estimation_manager/odom_main  || exit
  - Nimbro:
      layout: tiled
      panes:
        - waitForTime; roslaunch $ROS_LAUNCH_PATH/tf_throttle.launch
        - waitForTime; rosrun mrs_openswarm_real run_nimbro.py ./config/network_config.yaml `rospack find mrs_openswarm_real`/config/communication_config.yaml
  - status:
      layout: tiled
      panes:
        - waitForHw; roslaunch $ROS_LAUNCH_PATH/fsm_uav.launch
        - waitForHw; history -s roslaunch mrs_uav_autostart automatic_start.launch custom_config:=$ROS_CONFIG_PATH/automatic_start.yaml
        - waitForHw; roslaunch mrs_uav_status status.launch config_file:=$ROS_CONFIG_PATH/status_info.yaml
  - monitor:
      layout: tiled
      panes:
        - waitForHw; roslaunch $ROS_LAUNCH_PATH/node_crash_checker.launch
  - t_takeoff:
      layout: tiled
      panes:
        - waitForHw; history -s roslaunch mrs_uav_autostart automatic_start.launch custom_config:=$ROS_CONFIG_PATH/automatic_start.yaml
        - waitForControl; history -s rosservice call /$UAV_NAME/uav_manager/takeoff
  - t_goto_octo:
      layout: tiled
      panes:
        - waitForHw; history -s roslaunch mrs_uav_autostart automatic_start.launch
        - 'history -s rosservice call /$UAV_NAME/octomap_planner/goto \"goal: \[12.0, 51.0, 4.0, 0.0]\"'
        - 'history -s rosservice call /$UAV_NAME/octomap_planner/goto \"goal: \[5.0, 21.5, 4.0, 0.0\]\"'
        - 'history -s rosservice call /$UAV_NAME/octomap_planner/stop \"{}\"'
        - 'history -s rosbag record /$UAV_NAME/hw_api/imu /$UAV_NAME/witmotion_imu/imu'
        - 'history -s rostopic hz /$UAV_NAME/marker/berry_detection'
  - t_alt_poses:
      layout: tiled
      panes:
        - waitForHw; history -s roslaunch mrs_uav_autostart automatic_start.launch
        - 'history -s rosservice call /$UAV_NAME/control_manager/goto_altitude \"goal: 10.0\"'
        - 'history -s ./scripts/poses.sh'
  - t_waypoint:
      layout: tiled
      panes:
        - waitForHw; history -s roslaunch mrs_uav_autostart automatic_start.launch
        - history -s roslaunch $ROS_LAUNCH_PATH/pose_generator.launch
  # - t_waypoint_utm:
  #     layout: tiled
  #     panes:
  #       - waitForHw; history -s roslaunch mrs_uav_autostart automatic_start.launch
  #       - history -s roslaunch $ROS_LAUNCH_PATH/pose_generator_utm.launch
  - t_estimator:
      layout: tiled
      panes:
        - 'history -s rosservice call /$UAV_NAME/estimation_manager/change_estimator \"value: \"gps_garmin\"\"'
        - 'history -s rosservice call /$UAV_NAME/estimation_manager/change_estimator \"value: \"passthrough\"\"'
        - 'history -s rosservice call /$UAV_NAME/estimation_manager/change_estimator \"value: \"liosam\"\"'
  - MapGlobalService:
      layout: tiled
      panes:
        - waitForControl; roslaunch $ROS_LAUNCH_PATH/map_global_service.launch
        - 'history -s rosservice call /$UAV_NAME/map_global_generation/save_map'
  - commands:
      layout: tiled
      panes:
        - waitForHw; history -s roslaunch mrs_uav_autostart automatic_start.launch
        - waitForHw; history -s rosservice call /$UAV_NAME/hw_api/arming 1; sleep 2; rosservice call /$UAV_NAME/hw_api/offboard
        - waitForHw; history -s rosservice call /$UAV_NAME/mavros/cmd/command \"{broadcast:\ false, command:\ 246, confirmation:\ 0, param1:\ 1.0, param2:\ 0.0, param3:\ 0.0, param4:\ 0.0, param5:\ 0.0, param6:\ 0.0, param7:\ 0.0}\"
  - UWB:
      layout: tiled
      panes:
        - waitForTime; [ $SYS_UWB -eq 1 ] && roslaunch uwb_odom_publisher uwb_stack.launch || exit
        - waitForTime; [ $SYS_UWB -eq 1 ] && history -s roslaunch uwb_odom_publisher record_bag.launch || exit
  - bag:
      layout: tiled
      panes:
        - waitForRos; [ $SYS_ROSBAG_ENABLED -eq 1 ] && rosbag record $SYS_ROSBAG_ARGS $SYS_ROSBAG_TOPICS || exit
  - rviz:
      layout: tiled
      panes:
        - waitForTime; [ $USE_RVIZ -eq 1 ] && roslaunch $ROS_LAUNCH_PATH/mrs_rviz.launch
  - BerryDetector:
      layout: tiled
      panes:
        -  waitForHw; sleep 10; roslaunch continuous_gopro_photo continuous_photo.launch
  #       -  waitForHw; sleep 15; roslaunch berries_detector_gemmo berry_detector.launch
